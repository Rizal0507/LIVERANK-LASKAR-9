  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxRjAnO8z7zXOgT-Wkb9K4je3B8FR1dzj2EtZI6BRerTxZm8WyeET5G1n3sFPUlxKLt/exec";

    let liveData = { purna: [], smp: [], sma: [] };
    let previousRanks = { purna: {}, smp: {}, sma: {} };
    let previousFullSignature = { purna: "", smp: "", sma: "" };
    let activeMobileTab = 'smp';

    const tabLimits = { purna: 10, smp: 29, sma: 26 };

    // Tab Controller HP
    function setMobileTab(tabKey) {
      activeMobileTab = tabKey;
      updateMobileTabUI();
    }

    function updateMobileTabUI() {
      const isMobile = window.innerWidth < 768;
      
      ['purna', 'smp', 'sma'].forEach(cat => {
        const col = document.getElementById(`col-${cat}`);
        const mobBtn = document.getElementById(`mob-tab-${cat}`);
        
        if (mobBtn) {
          if (cat === activeMobileTab) {
            mobBtn.className = "flex-1 py-1.5 px-1 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all text-center bg-gradient-to-r from-blue-600 to-pink-500 text-white shadow-md";
          } else {
            mobBtn.className = "flex-1 py-1.5 px-1 rounded-lg text-[10px] font-black uppercase tracking-wider transition-all text-center text-slate-400 hover:text-white";
          }
        }

        if (col) {
          if (isMobile) {
            col.style.display = (cat === activeMobileTab) ? 'flex' : 'none';
          } else {
            col.style.display = 'flex';
          }
        }
      });
    }

    window.addEventListener('resize', updateMobileTabUI);

    // Update Jam Realtime (PC & HP)
    function updateLiveRealtimeClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
      const fullText = `${timeString} WIB`;

      const pcClock = document.getElementById('live-realtime-clock');
      const mobClock = document.getElementById('mob-live-clock');

      if (pcClock) pcClock.innerText = fullText;
      if (mobClock) mobClock.innerText = fullText;
    }
    setInterval(updateLiveRealtimeClock, 1000);
    updateLiveRealtimeClock();

    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        
        let hasChanged = false;

        ['purna', 'smp', 'sma'].forEach(cat => {
          const maxLimit = tabLimits[cat];
          const rawItems = (data[cat] || []).slice(0, maxLimit);
          const currentSignature = rawItems.map(item => `${item.rank}:${item.totalNilai}:${item.pbb}`).join('|');

          if (previousFullSignature[cat] !== currentSignature) {
            hasChanged = true;
          }
        });

        // Update Last Update Clock (PC & HP) HANYA saat data berubah
        const pcLastClock = document.getElementById('last-update-clock');
        if (hasChanged || (pcLastClock && pcLastClock.innerText.includes('--'))) {
          const now = new Date();
          const timeStr = `${now.toLocaleTimeString('id-ID', { hour12: false })} WIB`;
          
          if (pcLastClock) pcLastClock.innerText = timeStr;
          const mobLastClock = document.getElementById('mob-update-clock');
          if (mobLastClock) mobLastClock.innerText = timeStr;
        }

        checkConfettiTrigger(data);
        liveData = data;
        renderAllCategories();
        updateMobileTabUI();

      } catch (error) {
        console.error("Gagal mengambil data:", error);
      }
    }

    function checkConfettiTrigger(newData) {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const maxLimit = tabLimits[cat];
        const rawItems = (newData[cat] || []).slice(0, maxLimit);
        const top3 = rawItems.slice(0, 3);
        const currentSignature = top3.map(item => `${item.rank}:${item.totalNilai}`).join('|');

        if (previousFullSignature[cat] && previousFullSignature[cat] !== currentSignature) {
          const hasScores = top3.some(item => item.totalNilai > 0);
          if (hasScores) {
            triggerConfetti();
          }
        }
        previousFullSignature[cat] = currentSignature;
      });
    }

    function triggerConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

            <circle cx="50" cy="50" r="34" fill="url(#bronzeInner_${u})" stroke="#78350f" stroke-width="2"/>
            <circle cx="50" cy="50" r="27" stroke="#451a03" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
            <path d="M43 27 L44 29 L46 29 L44.5 30.5 L45 32.5 L43 31 L41 32.5 L41.5 30.5 L40 29 L42 29 Z" fill="#78350f"/>
            <path d="M50 24 L51.5 26.5 L54 26.5 L52 28 L53 30.5 L50 29 L47 30.5 L48 28 L46 26.5 L48.5 26.5 Z" fill="#78350f"/>
            <path d="M57 27 L58 29 L60 29 L58.5 30.5 L59 32.5 L57 31 L55 32.5 L55.5 30.5 L54 29 L56 29 Z" fill="#78350f"/>
            <text x="50" y="61" font-family="Poppins, sans-serif" font-size="32" font-weight="900" fill="#451a03" text-anchor="middle">3</text>
          </svg>
        `;
      }
    }

    function buildPodiumCard(item, i, cat) {
      const podiumConfig = [
        { bg: 'bg-gradient-to-b from-amber-50 to-orange-50/80 border-amber-300', titleColor: 'text-amber-900' },
        { bg: 'bg-gradient-to-b from-slate-50 to-slate-100/80 border-slate-300', titleColor: 'text-slate-800' },
        { bg: 'bg-gradient-to-b from-orange-50 to-amber-100/60 border-orange-300', titleColor: 'text-orange-950' }
      ];

      const cfg = podiumConfig[i];
      const data = item || { rank: `UTAMA ${i+1}`, totalNilai: 0, pbb: 0 };

      let gfTicket = '';
      if (cat === 'smp' || cat === 'sma') {
        gfTicket = `
          <div class="mt-1">
            <span class="shining-ticket inline-flex items-center gap-1 text-[8px] font-black text-amber-950 px-1.5 py-0.5 rounded-md uppercase tracking-wider border border-amber-300/80">
              <i class="fa-solid fa-ticket text-[9px]"></i> GRANDFINAL
            </span>
          </div>
        `;
      }

      return `
        <div class="relative ${cfg.bg} border-2 rounded-xl p-2 pt-2.5 flex flex-col justify-between shadow-sm min-h-[76px] overflow-visible w-full">
          <div class="absolute -top-4 -left-3 z-20">
            ${getRosetteBadge(i + 1)}
          </div>

          <div class="pl-8">
            <div class="text-[10px] md:text-[11px] font-black ${cfg.titleColor} leading-tight truncate">
              ${data.rank || `UTAMA ${i+1}`}
            </div>
            ${gfTicket}
          </div>

          <div class="mt-1.5 flex items-center justify-between border-t border-slate-200/80 pt-1">
            <div class="text-[9px] font-bold text-slate-700">TOTAL: <span class="text-blue-700 font-black text-[11px]">${data.totalNilai}</span></div>
            <div class="text-[9px] font-bold text-pink-600">PBB: ${data.pbb}</div>
          </div>
        </div>
      `;
    }

    function renderAllCategories() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const container = document.getElementById(`card-${cat}`);
        container.innerHTML = '';

        const maxLimit = tabLimits[cat];
        const items = (liveData[cat] || []).slice(0, maxLimit);

        if (items.length === 0) {
          container.innerHTML = `<div class="p-4 text-center text-slate-400 font-semibold italic text-xs">Memuat data...</div>`;
          return;
        }

        const top3 = items.slice(0, 3);
        const remainingItems = items.slice(3);

        // --- 1. PODIUM TOP 3 CARDS ---
        let podiumWrapper = document.createElement('div');

        if (cat === 'purna') {
          podiumWrapper.className = "flex flex-col items-center gap-2 mb-2 mt-2 flex-shrink-0 w-full";
          podiumWrapper.innerHTML = `
            <div class="flex justify-center w-full">
              <div class="w-full max-w-[210px]">
                ${buildPodiumCard(top3[0], 0, cat)}
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2 w-full max-w-[430px]">
              ${buildPodiumCard(top3[1], 1, cat)}
              ${buildPodiumCard(top3[2], 2, cat)}
            </div>
          `;
        } else {
          podiumWrapper.className = "grid grid-cols-3 gap-2 mb-2 mt-2 flex-shrink-0 w-full";
          let podiumHtml = '';
          for (let i = 0; i < 3; i++) {
            podiumHtml += buildPodiumCard(top3[i], i, cat);
          }
          podiumWrapper.innerHTML = podiumHtml;
        }

        container.appendChild(podiumWrapper);

        // --- 2. SUB-TABEL BANJAR ---
        const mid = Math.ceil(remainingItems.length / 2);
        const leftList = remainingItems.slice(0, mid);
        const rightList = remainingItems.slice(mid);

        const tablesGrid = document.createElement('div');
        tablesGrid.className = "grid grid-cols-2 gap-2 flex-1 items-stretch overflow-hidden mt-1";

        const isPinkHeader = cat === 'purna' || cat === 'sma';
        const headerBg = isPinkHeader ? 'bg-pink-600' : 'bg-blue-600';

        function buildSubTable(dataList, startIndex) {
          if (dataList.length === 0) return `<div class="h-full bg-slate-50 rounded-xl border border-slate-100"></div>`;

          const rows = dataList.map((item, idx) => {
            const actualIndex = startIndex + idx;
            const itemKey = item.rank || `row-${actualIndex}`;

            let arrowIndicator = "";
            if (previousRanks[cat] && previousRanks[cat][itemKey] !== undefined) {
              const prevIdx = previousRanks[cat][itemKey];
              if (actualIndex < prevIdx) {
                arrowIndicator = `<span class="text-emerald-500 font-black text-[10px] ml-1 animate-glow glow-green">▲</span>`;
              } else if (actualIndex > prevIdx) {
                arrowIndicator = `<span class="text-rose-500 font-black text-[10px] ml-1 animate-glow glow-red">▼</span>`;
              }
            }

            if (!previousRanks[cat]) previousRanks[cat] = {};
            previousRanks[cat][itemKey] = actualIndex;

            return `
              <tr class="bg-white hover:bg-slate-50 border-b border-slate-100 text-[10px] md:text-[11px] leading-tight">
                <td class="py-1 px-2 font-extrabold text-slate-800 truncate">
                  <div class="flex items-center">
                    <span class="truncate">${item.rank || '-'}</span>
                    ${arrowIndicator}
                  </div>
                </td>
                <td class="py-1 px-2 text-center font-black text-blue-700 w-14">${item.totalNilai}</td>
                <td class="py-1 px-2 text-center font-bold text-pink-600 w-10">${item.pbb}</td>
              </tr>
            `;
          }).join('');

          return `
            <div class="border border-slate-200 rounded-xl overflow-hidden shadow-xs h-full flex flex-col justify-between bg-white">
              <table class="w-full text-left border-collapse h-full">
                <thead>
                  <tr class="${headerBg} text-white text-[9px] md:text-[10px] font-black uppercase tracking-wider">
                    <th class="py-1 px-2">RANK</th>
                    <th class="py-1 px-2 text-center w-14">TOTAL</th>
                    <th class="py-1 px-2 text-center w-10">PBB</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 flex-1">
                  ${rows}
                </tbody>
              </table>
            </div>
          `;
        }

        tablesGrid.innerHTML = buildSubTable(leftList, 0) + buildSubTable(rightList, leftList.length);
        container.appendChild(tablesGrid);
      });
    }

    // Inisialisasi
    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
