<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE RANK LKBB LASKAR 9</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: #0d1527;
    }
    
    * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .header-gradient {
      background: linear-gradient(135deg, #0284c7 0%, #1e40af 40%, #db2777 100%);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    .animate-glow {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body class="text-slate-800 font-sans flex flex-col justify-between h-screen p-0 m-0">

  <!-- HEADER BRANDING -->
  <header class="header-gradient text-white shadow-xl border-b-2 border-pink-400 py-1.5 px-4 flex-shrink-0">
    <div class="max-w-[1850px] mx-auto flex items-center justify-between gap-2">
      
      <!-- LOGO KIRI -->
      <div class="flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1Hrwrv_NmmmPfOz8jF-S1PqVpnfh5iVF2" 
             alt="Logo Kiri" 
             class="h-14 md:h-16 w-auto object-contain drop-shadow-[0_0_10px_rgba(255,255,255,0.4)]">
      </div>

      <!-- JUDUL & PROMOSI (GAYA GAMBAR ACUAN) -->
      <div class="text-center flex-1">
        <div class="flex items-center justify-center gap-2">
          <span class="inline-flex items-center gap-1 bg-pink-600 text-white text-[10px] md:text-xs px-2 py-0.5 rounded-full font-black tracking-wider uppercase shadow-sm">
            <span class="w-2 h-2 rounded-full bg-white animate-ping"></span> LIVE
          </span>
          <h1 class="text-xl md:text-3xl font-black tracking-wider text-white uppercase drop-shadow">
            RANK LKBB LASKAR 9
          </h1>
        </div>
        
        <!-- SUBHEADER REKAP BY REKAP ANDALAN -->
        <div class="mt-0.5 flex items-center justify-center gap-2 text-[11px] md:text-xs font-bold text-blue-100">
          <span class="h-[1px] w-8 md:w-16 bg-blue-300/40"></span>
          <span>REKAP BY <strong class="text-white uppercase tracking-wider">REKAP ANDALAN</strong></span>
          <span class="hidden md:inline">|</span>
          <span class="hidden md:flex items-center gap-1 text-pink-200">
            <i class="fab fa-instagram"></i> Tjobrut.store | cosmoatribut
          </span>
          <span class="hidden md:inline">|</span>
          <span class="hidden md:flex items-center gap-1 text-green-300">
            <i class="fab fa-whatsapp"></i> 0896-9402-4600
          </span>
          <span class="h-[1px] w-8 md:w-16 bg-blue-300/40"></span>
        </div>
      </div>

      <!-- LOGO KANAN & LAST UPDATE -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="hidden sm:flex flex-col items-end bg-blue-950/60 px-3 py-1 rounded-xl border border-blue-400/30 text-right">
          <span class="text-[9px] text-blue-200 uppercase tracking-widest font-bold flex items-center gap-1">
            <i class="fa-regular fa-clock"></i> LAST UPDATE
          </span>
          <span id="live-clock" class="text-xs md:text-sm font-black text-white">00:00:00 WIB</span>
        </div>

        <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0" 
             alt="Logo Kanan" 
             class="h-16 md:h-20 w-auto object-contain drop-shadow-[0_0_10px_rgba(255,255,255,0.4)]">
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA: 3 KOTAK TINGKATAN BERSISIAN -->
  <main class="flex-1 px-3 py-2 overflow-hidden max-w-[1850px] w-full mx-auto flex flex-col">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 h-full items-stretch">
      
      <!-- KATEGORI 1: PURNA / MANAGEMENT -->
      <div class="bg-white border-2 border-pink-400 rounded-2xl shadow-lg flex flex-col overflow-hidden">
        <div class="bg-gradient-to-r from-pink-600 to-rose-500 text-white font-black text-center py-1.5 px-3 text-xs md:text-sm tracking-wider uppercase shadow flex items-center justify-center gap-2">
          <i class="fa-solid fa-users text-sm"></i> PURNA / MANAGEMENT
        </div>
        <div class="flex-1 p-1.5 flex flex-col justify-between overflow-hidden" id="card-purna">
          <!-- Render via JS -->
        </div>
      </div>

      <!-- KATEGORI 2: SMP / MTs -->
      <div class="bg-white border-2 border-blue-400 rounded-2xl shadow-lg flex flex-col overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-black text-center py-1.5 px-3 text-xs md:text-sm tracking-wider uppercase shadow flex items-center justify-center gap-2">
          <i class="fa-solid fa-graduation-cap text-sm"></i> SMP / MTs
        </div>
        <div class="flex-1 p-1.5 flex flex-col justify-between overflow-hidden" id="card-smp">
          <!-- Render via JS -->
        </div>
      </div>

      <!-- KATEGORI 3: SMA / SMK / MA -->
      <div class="bg-white border-2 border-pink-400 rounded-2xl shadow-lg flex flex-col overflow-hidden">
        <div class="bg-gradient-to-r from-pink-600 to-purple-600 text-white font-black text-center py-1.5 px-3 text-xs md:text-sm tracking-wider uppercase shadow flex items-center justify-center gap-2">
          <i class="fa-solid fa-graduation-cap text-sm"></i> SMA / SMK / MA
        </div>
        <div class="flex-1 p-1.5 flex flex-col justify-between overflow-hidden" id="card-sma">
          <!-- Render via JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER BAR -->
  <footer class="bg-gradient-to-r from-blue-900 via-pink-700 to-blue-900 text-white text-[10px] md:text-xs font-black py-1 px-4 text-center border-t border-pink-400/40 flex-shrink-0 flex items-center justify-center gap-3 tracking-widest uppercase shadow-md">
    <span class="h-[1px] w-12 bg-white/30"></span>
    <span>DISIPLIN &bull; TANGGUH &bull; BERPRESTASI</span>
    <span class="h-[1px] w-12 bg-white/30"></span>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwGdIdN41HgOWlP6YnWfaS2HcONT7JHYaLQ-8a9uouYSjTiYnvzCXa8NCRdn59EkE1h/exec";

    let liveData = { purna: [], smp: [], sma: [] };
    let previousTop3State = { purna: "", smp: "", sma: "" };

    const tabLimits = { purna: 10, smp: 29, sma: 26 };

    // Update Jam Real-time
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
      document.getElementById('live-clock').innerText = `${timeString} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        liveData = data;
        
        checkConfettiTrigger();
        renderAllCategories();
      } catch (error) {
        console.error("Gagal mengambil data:", error);
      }
    }

    // Deteksi Perubahan Top 3 untuk Kembang Api
    function checkConfettiTrigger() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const maxLimit = tabLimits[cat];
        const rawItems = (liveData[cat] || []).slice(0, maxLimit);
        const top3 = rawItems.slice(0, 3);
        const currentSignature = top3.map(item => `${item.rank}:${item.totalNilai}`).join('|');

        if (previousTop3State[cat] && previousTop3State[cat] !== currentSignature) {
          const hasScores = top3.some(item => item.totalNilai > 0);
          if (hasScores) {
            triggerConfetti();
          }
        }
        previousTop3State[cat] = currentSignature;
      });
    }

    // Efek Confetti Kembang Api
    function triggerConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // Render Semua Kategori Sesuai Layout Gambar Acuan
    function renderAllCategories() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const container = document.getElementById(`card-${cat}`);
        container.innerHTML = '';

        const maxLimit = tabLimits[cat];
        const items = (liveData[cat] || []).slice(0, maxLimit);

        if (items.length === 0) {
          container.innerHTML = `<div class="p-4 text-center text-slate-400 font-semibold italic text-xs">Memuat data...</div>`;
          return;
        }

        // Ambil Top 3 untuk Podium Cards
        const top3 = items.slice(0, 3);
        // Sisanya untuk Tabel Split 2 Kolom
        const remainingItems = items.slice(3);

        // --- 1. PODIUM TOP 3 CARDS ---
        const podiumWrapper = document.createElement('div');
        podiumWrapper.className = "grid grid-cols-3 gap-1 mb-1.5 flex-shrink-0";

        const podiumConfig = [
          { bg: 'bg-amber-50/90 border-amber-300', medalBg: 'bg-gradient-to-tr from-amber-500 to-yellow-300 text-slate-900', num: '1', titleColor: 'text-amber-800' },
          { bg: 'bg-slate-50/90 border-slate-300', medalBg: 'bg-gradient-to-tr from-slate-400 to-slate-200 text-slate-900', num: '2', titleColor: 'text-slate-700' },
          { bg: 'bg-orange-50/90 border-orange-300', medalBg: 'bg-gradient-to-tr from-amber-700 to-orange-400 text-white', num: '3', titleColor: 'text-orange-900' }
        ];

        let podiumHtml = '';
        for (let i = 0; i < 3; i++) {
          const item = top3[i] || { rank: `UTAMA ${i+1}`, totalNilai: 0, pbb: 0 };
          const cfg = podiumConfig[i];

          // Badge GF khusus Juara Utama di SMP & SMA
          let gfBadge = '';
          if (cat === 'smp' || cat === 'sma') {
            gfBadge = `<span class="inline-flex items-center gap-0.5 text-[8px] px-1 py-0.2 rounded bg-amber-100 border border-amber-300 text-amber-900 font-black animate-glow ml-1">
              <i class="fa-solid fa-trophy text-amber-600"></i> GF
            </span>`;
          }

          podiumHtml += `
            <div class="${cfg.bg} border rounded-xl p-1 flex items-center justify-between shadow-xs">
              <div class="flex items-center gap-1 min-w-0">
                <div class="w-6 h-6 rounded-full ${cfg.medalBg} font-black text-[11px] flex items-center justify-center shadow-xs flex-shrink-0">
                  ${cfg.num}
                </div>
                <div class="truncate">
                  <div class="text-[9px] font-black ${cfg.titleColor} leading-tight truncate flex items-center">
                    ${item.rank || `UTAMA ${i+1}`}
                  </div>
                  ${gfBadge}
                </div>
              </div>
              <div class="text-right flex-shrink-0 pl-1">
                <div class="text-[11px] font-black text-blue-700 leading-tight">${item.totalNilai}</div>
                <div class="text-[9px] font-bold text-pink-600 leading-tight">PBB: ${item.pbb}</div>
              </div>
            </div>
          `;
        }
        podiumWrapper.innerHTML = podiumHtml;
        container.appendChild(podiumWrapper);

        // --- 2. SUB-TABEL SPLIT 2 KOLOM ---
        const mid = Math.ceil(remainingItems.length / 2);
        const leftList = remainingItems.slice(0, mid);
        const rightList = remainingItems.slice(mid);

        const tablesGrid = document.createElement('div');
        tablesGrid.className = "grid grid-cols-2 gap-1.5 flex-1 items-start overflow-hidden";

        const isPinkHeader = cat === 'purna' || cat === 'sma';
        const headerBg = isPinkHeader ? 'bg-pink-600' : 'bg-blue-600';

        function buildSubTable(dataList) {
          if (dataList.length === 0) return `<div class="h-full bg-slate-50 rounded-lg"></div>`;

          const rows = dataList.map((item, idx) => `
            <tr class="bg-white hover:bg-slate-50 border-b border-slate-100 text-[9px] leading-tight">
              <td class="py-[1.5px] px-1 text-center font-bold text-slate-500 w-5">${item.no || '-'}</td>
              <td class="py-[1.5px] px-1 font-extrabold text-slate-800 truncate">${item.rank || '-'}</td>
              <td class="py-[1.5px] px-1 text-center font-black text-blue-700 w-7">${item.totalNilai}</td>
              <td class="py-[1.5px] px-1 text-center font-bold text-pink-600 w-6">${item.pbb}</td>
            </tr>
          `).join('');

          return `
            <div class="border border-slate-200 rounded-lg overflow-hidden shadow-2xs h-full">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="${headerBg} text-white text-[8px] font-black uppercase tracking-wider">
                    <th class="py-1 px-1 text-center w-5">#</th>
                    <th class="py-1 px-1">RANK</th>
                    <th class="py-1 px-1 text-center w-7">TOT</th>
                    <th class="py-1 px-1 text-center w-6">PBB</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${rows}
                </tbody>
              </table>
            </div>
          `;
        }

        tablesGrid.innerHTML = buildSubTable(leftList) + buildSubTable(rightList);
        container.appendChild(tablesGrid);
      });
    }

    // Inisialisasi
    fetchData();
    setInterval(fetchData, 5000); // Auto-refresh 5 detik
  </script>
</body>
</html>
