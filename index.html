<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE RANK LKBB LASKAR 9</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: #0b0f19;
    }
    .gradient-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31102f 100%);
    }
    
    /* Custom Scrollbar Rapi */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(236, 72, 153, 0.4);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(236, 72, 153, 0.8);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    .animate-glow {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body class="text-slate-100 font-sans flex flex-col justify-between h-screen p-0 m-0">

  <!-- HEADER / BRANDING -->
  <header class="gradient-header text-white shadow-2xl border-b-2 border-pink-500/40 py-2 px-6 flex-shrink-0">
    <div class="max-w-[1800px] mx-auto flex items-center justify-between gap-4">
      
      <!-- LOGO KIRI (TANPA BORDER & LEBIH BESAR) -->
      <div class="flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1Hrwrv_NmmmPfOz8jF-S1PqVpnfh5iVF2" 
             alt="Logo Kiri" 
             class="h-20 md:h-24 w-auto object-contain drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">
      </div>

      <!-- JUDUL & PROMOSI -->
      <div class="text-center flex-1">
        <h1 class="text-2xl md:text-4xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 via-pink-300 to-amber-200 leading-tight uppercase drop-shadow-[0_2px_10px_rgba(236,72,153,0.3)]">
          LIVE RANK LKBB LASKAR 9
        </h1>
        
        <!-- PROMO SUBTITLE -->
        <div class="mt-1 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-xs md:text-sm font-semibold text-slate-300">
          <span class="bg-slate-900/80 px-3 py-0.5 rounded-full border border-blue-500/30">
            dibuat oleh <strong class="text-white font-extrabold">Rekap Andalan</strong>
          </span>
          <span class="flex items-center gap-1.5 bg-slate-900/80 px-3 py-0.5 rounded-full border border-pink-500/30">
            <i class="fab fa-instagram text-pink-400"></i> Tjobrut.store | cosmoatribut
          </span>
          <span class="flex items-center gap-1.5 bg-slate-900/80 px-3 py-0.5 rounded-full border border-green-500/30 text-green-300">
            <i class="fab fa-whatsapp text-green-400"></i> 0896-9402-4600
          </span>
          <span class="flex items-center gap-1.5 bg-pink-950/80 px-3 py-0.5 rounded-full border border-pink-400/50 text-pink-300 font-bold">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-pink-500"></span>
            </span>
            <span id="live-clock">LIVE 00:00:00 WIB</span>
          </span>
        </div>
      </div>

      <!-- LOGO KANAN (DIPERBESAR KHUSUS & TANPA BORDER) -->
      <div class="flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0" 
             alt="Logo Kanan" 
             class="h-24 md:h-28 w-auto object-contain drop-shadow-[0_0_15px_rgba(236,72,153,0.5)] scale-105">
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA: 3 TABEL TINGKATAN BERSISIAN -->
  <main class="flex-1 px-4 py-3 overflow-hidden max-w-[1800px] w-full mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 h-full">
      
      <!-- TABEL 1: PURNA / MANAGEMENT -->
      <div class="bg-[#111827]/90 border border-pink-500/30 rounded-2xl shadow-xl flex flex-col overflow-hidden backdrop-blur-md">
        <div class="bg-gradient-to-r from-pink-700 to-purple-800 text-white font-black text-center py-2 px-4 text-base md:text-lg tracking-wider uppercase border-b border-pink-500/30 shadow-md">
          PURNA / MANAGEMENT <span class="text-xs font-semibold opacity-80">(10)</span>
        </div>
        <div class="flex-1 overflow-y-auto custom-scroll p-2" id="container-purna">
          <!-- Data Purna -->
        </div>
      </div>

      <!-- TABEL 2: SMP / MTs -->
      <div class="bg-[#111827]/90 border border-cyan-500/30 rounded-2xl shadow-xl flex flex-col overflow-hidden backdrop-blur-md">
        <div class="bg-gradient-to-r from-cyan-700 to-blue-800 text-white font-black text-center py-2 px-4 text-base md:text-lg tracking-wider uppercase border-b border-cyan-500/30 shadow-md">
          SMP / MTs <span class="text-xs font-semibold opacity-80">(29)</span>
        </div>
        <div class="flex-1 overflow-y-auto custom-scroll p-2" id="container-smp">
          <!-- Data SMP -->
        </div>
      </div>

      <!-- TABEL 3: SMA / SMK / MA -->
      <div class="bg-[#111827]/90 border border-amber-500/30 rounded-2xl shadow-xl flex flex-col overflow-hidden backdrop-blur-md">
        <div class="bg-gradient-to-r from-amber-600 to-yellow-700 text-white font-black text-center py-2 px-4 text-base md:text-lg tracking-wider uppercase border-b border-amber-500/30 shadow-md">
          SMA / SMK / MA <span class="text-xs font-semibold opacity-80">(26)</span>
        </div>
        <div class="flex-1 overflow-y-auto custom-scroll p-2" id="container-sma">
          <!-- Data SMA -->
        </div>
      </div>

    </div>
  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwGdIdN41HgOWlP6YnWfaS2HcONT7JHYaLQ-8a9uouYSjTiYnvzCXa8NCRdn59EkE1h/exec";

    let liveData = { purna: [], smp: [], sma: [] };
    let previousTop3State = { purna: "", smp: "", sma: "" };

    const tabLimits = { purna: 10, smp: 29, sma: 26 };

    // Update Jam Live Real-Time
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
      document.getElementById('live-clock').innerText = `LIVE ${timeString} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        liveData = data;
        
        checkConfettiTrigger();
        renderAllTables();
      } catch (error) {
        console.error("Gagal mengambil data:", error);
      }
    }

    // Deteksi Perubahan Top 3 untuk Kembang Api
    function checkConfettiTrigger() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const maxLimit = tabLimits[cat];
        const rawItems = (liveData[cat] || []).slice(0, maxLimit);
        const top3 = rawItems.slice(0, 3);
        const currentSignature = top3.map(item => `${item.rank}:${item.totalNilai}`).join('|');

        if (previousTop3State[cat] && previousTop3State[cat] !== currentSignature) {
          const hasScores = top3.some(item => item.totalNilai > 0);
          if (hasScores) {
            triggerConfetti();
          }
        }
        previousTop3State[cat] = currentSignature;
      });
    }

    // Efek Confetti Kembang Api
    function triggerConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // Render Ketiga Tabel Sekaligus
    function renderAllTables() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const container = document.getElementById(`container-${cat}`);
        container.innerHTML = '';

        const maxLimit = tabLimits[cat];
        const items = (liveData[cat] || []).slice(0, maxLimit);

        if (items.length === 0) {
          container.innerHTML = `<div class="p-6 text-center text-slate-500 font-semibold italic">Memuat data...</div>`;
          return;
        }

        const table = document.createElement('table');
        table.className = "w-full text-left border-collapse";

        let rowsHtml = items.map((item, index) => {
          const isTop3 = index < 3;

          let rankBgClass = "bg-slate-900/60 hover:bg-slate-800/80";
          let rankBadgeStyle = "bg-slate-700 text-slate-300";

          if (index === 0) {
            rankBgClass = "bg-amber-950/40 hover:bg-amber-900/50 border-l-4 border-amber-500";
            rankBadgeStyle = "bg-amber-500 text-slate-950 font-black shadow-md shadow-amber-500/20";
          } else if (index === 1) {
            rankBgClass = "bg-slate-800/60 hover:bg-slate-700/60 border-l-4 border-slate-400";
            rankBadgeStyle = "bg-slate-300 text-slate-950 font-black shadow-md shadow-slate-300/20";
          } else if (index === 2) {
            rankBgClass = "bg-orange-950/40 hover:bg-orange-900/50 border-l-4 border-orange-600";
            rankBadgeStyle = "bg-amber-700 text-white font-black shadow-md shadow-amber-700/20";
          }

          // Badge GF Khusus SMP & SMA
          let grandFinalBadge = "";
          if (isTop3 && (cat === 'smp' || cat === 'sma')) {
            const colors = ['text-amber-400', 'text-slate-300', 'text-amber-600'];
            grandFinalBadge = `<span class="inline-flex items-center gap-1 ml-1 text-[9px] px-1.5 py-0.2 rounded-full bg-amber-500/20 border border-amber-400/50 text-amber-300 font-black animate-glow">
              <i class="fa-solid fa-trophy ${colors[index]}"></i> GF
            </span>`;
          }

          return `
            <tr class="${rankBgClass} border-b border-slate-800/60 text-xs transition-colors">
              <td class="py-1.5 px-3 font-bold text-slate-200">
                <div class="flex items-center">
                  <span class="inline-block px-2 py-0.5 rounded text-[11px] ${rankBadgeStyle}">
                    ${item.rank || (index + 1)}
                  </span>
                  ${grandFinalBadge}
                </div>
              </td>
              <td class="py-1.5 px-3 text-center font-extrabold text-cyan-400 text-sm w-24">
                ${item.totalNilai}
              </td>
              <td class="py-1.5 px-3 text-center font-bold text-pink-400 text-xs w-20">
                ${item.pbb}
              </td>
            </tr>
          `;
        }).join('');

        table.innerHTML = `
          <thead>
            <tr class="bg-slate-950/80 text-slate-400 text-[10px] uppercase tracking-wider border-b border-slate-800">
              <th class="py-1.5 px-3 text-left">RANK</th>
              <th class="py-1.5 px-3 text-center w-24">TOTAL</th>
              <th class="py-1.5 px-3 text-center w-20">PBB</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/40">
            ${rowsHtml}
          </tbody>
        `;

        container.appendChild(table);
      });
    }

    // Inisialisasi
    fetchData();
    setInterval(fetchData, 5000); // Auto-refresh 5 detik
  </script>
</body>
</html>
