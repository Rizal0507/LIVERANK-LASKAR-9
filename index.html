<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE RANK LKBB LASKAR 9</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: #f8fafc; /* Base Putih Modern */
    }
    
    /* Kunci total scrollbar */
    * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .gradient-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 45%, #ec4899 100%);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    .animate-glow {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body class="text-slate-800 font-sans flex flex-col justify-between h-screen p-0 m-0">

  <!-- HEADER / BRANDING (TEMA BIRU, PINK & PUTIH) -->
  <header class="gradient-header text-white shadow-lg border-b-4 border-pink-500 py-2 px-6 flex-shrink-0">
    <div class="max-w-[1800px] mx-auto flex items-center justify-between gap-4">
      
      <!-- LOGO KIRI (TANPA BORDER) -->
      <div class="flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1Hrwrv_NmmmPfOz8jF-S1PqVpnfh5iVF2" 
             alt="Logo Kiri" 
             class="h-16 md:h-20 w-auto object-contain drop-shadow-md">
      </div>

      <!-- JUDUL & PROMOSI -->
      <div class="text-center flex-1">
        <h1 class="text-2xl md:text-4xl font-black tracking-wider text-white leading-tight uppercase drop-shadow-md">
          LIVE RANK LKBB LASKAR 9
        </h1>
        
        <!-- PROMO SUBTITLE -->
        <div class="mt-1 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-xs md:text-sm font-semibold text-blue-100">
          <span class="bg-blue-900/60 px-3 py-0.5 rounded-full border border-blue-300/30">
            Rekap by <strong class="text-white font-extrabold">Rekap Andalan</strong>
          </span>
          <span class="flex items-center gap-1.5 bg-pink-900/60 px-3 py-0.5 rounded-full border border-pink-300/30">
            <i class="fab fa-instagram text-pink-300"></i> Tjobrut.store | cosmoatribut
          </span>
          <span class="flex items-center gap-1.5 bg-emerald-900/60 px-3 py-0.5 rounded-full border border-emerald-300/30 text-emerald-200">
            <i class="fab fa-whatsapp text-emerald-300"></i> 0896-9402-4600
          </span>
          <span class="flex items-center gap-1.5 bg-white/20 px-3 py-0.5 rounded-full text-white font-bold backdrop-blur-sm">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-300 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-pink-400"></span>
            </span>
            <span id="live-clock">LIVE 00:00:00 WIB</span>
          </span>
        </div>
      </div>

      <!-- LOGO KANAN (DIPERBESAR & TANPA BORDER) -->
      <div class="flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0" 
             alt="Logo Kanan" 
             class="h-20 md:h-24 w-auto object-contain drop-shadow-md">
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA: 3 TABEL TINGKATAN BERSISIAN (BASE BACKGROUND PUTIH) -->
  <main class="flex-1 px-4 py-2 overflow-hidden max-w-[1800px] w-full mx-auto flex flex-col">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 h-full items-stretch">
      
      <!-- TABEL 1: PURNA / MANAGEMENT -->
      <div class="bg-white border border-pink-200 rounded-2xl shadow-md flex flex-col overflow-hidden">
        <div class="bg-gradient-to-r from-pink-600 to-pink-500 text-white font-black text-center py-1.5 px-4 text-sm md:text-base tracking-wider uppercase shadow-sm">
          PURNA / MANAGEMENT
        </div>
        <div class="flex-1 overflow-hidden p-1.5" id="container-purna">
          <!-- Data Purna -->
        </div>
      </div>

      <!-- TABEL 2: SMP / MTs -->
      <div class="bg-white border border-blue-200 rounded-2xl shadow-md flex flex-col overflow-hidden">
        <div class="bg-gradient-to-r from-blue-700 to-blue-500 text-white font-black text-center py-1.5 px-4 text-sm md:text-base tracking-wider uppercase shadow-sm">
          SMP / MTs
        </div>
        <div class="flex-1 overflow-hidden p-1.5" id="container-smp">
          <!-- Data SMP -->
        </div>
      </div>

      <!-- TABEL 3: SMA / SMK / MA -->
      <div class="bg-white border border-indigo-200 rounded-2xl shadow-md flex flex-col overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-700 via-blue-600 to-pink-600 text-white font-black text-center py-1.5 px-4 text-sm md:text-base tracking-wider uppercase shadow-sm">
          SMA / SMK / MA
        </div>
        <div class="flex-1 overflow-hidden p-1.5" id="container-sma">
          <!-- Data SMA -->
        </div>
      </div>

    </div>
  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwGdIdN41HgOWlP6YnWfaS2HcONT7JHYaLQ-8a9uouYSjTiYnvzCXa8NCRdn59EkE1h/exec";

    let liveData = { purna: [], smp: [], sma: [] };
    let previousTop3State = { purna: "", smp: "", sma: "" };

    const tabLimits = { purna: 10, smp: 29, sma: 26 };

    // Jam Real-Time
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
      document.getElementById('live-clock').innerText = `LIVE ${timeString} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        liveData = data;
        
        checkConfettiTrigger();
        renderAllTables();
      } catch (error) {
        console.error("Gagal mengambil data:", error);
      }
    }

    // Deteksi Perubahan Top 3 untuk Kembang Api
    function checkConfettiTrigger() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const maxLimit = tabLimits[cat];
        const rawItems = (liveData[cat] || []).slice(0, maxLimit);
        const top3 = rawItems.slice(0, 3);
        const currentSignature = top3.map(item => `${item.rank}:${item.totalNilai}`).join('|');

        if (previousTop3State[cat] && previousTop3State[cat] !== currentSignature) {
          const hasScores = top3.some(item => item.totalNilai > 0);
          if (hasScores) {
            triggerConfetti();
          }
        }
        previousTop3State[cat] = currentSignature;
      });
    }

    // Efek Confetti Kembang Api Layar Penuh
    function triggerConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // Render Ketiga Tabel Sekaligus
    function renderAllTables() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const container = document.getElementById(`container-${cat}`);
        container.innerHTML = '';

        const maxLimit = tabLimits[cat];
        const items = (liveData[cat] || []).slice(0, maxLimit);

        if (items.length === 0) {
          container.innerHTML = `<div class="p-4 text-center text-slate-400 font-semibold italic text-xs">Memuat data...</div>`;
          return;
        }

        const table = document.createElement('table');
        table.className = "w-full text-left border-collapse h-full";

        let rowsHtml = items.map((item, index) => {
          const isTop3 = index < 3;

          let rankBgClass = "bg-white hover:bg-slate-50";
          let rankBadgeStyle = "bg-slate-100 text-slate-700 border border-slate-200";

          if (index === 0) {
            rankBgClass = "bg-amber-50/80 font-bold border-l-4 border-amber-500";
            rankBadgeStyle = "bg-amber-500 text-white font-black shadow-xs";
          } else if (index === 1) {
            rankBgClass = "bg-slate-100/80 font-bold border-l-4 border-slate-400";
            rankBadgeStyle = "bg-slate-400 text-white font-black shadow-xs";
          } else if (index === 2) {
            rankBgClass = "bg-orange-50/80 font-bold border-l-4 border-orange-500";
            rankBadgeStyle = "bg-amber-700 text-white font-black shadow-xs";
          }

          // Badge GF Khusus SMP & SMA pada Juara Utama 1, 2, 3
          let grandFinalBadge = "";
          if (isTop3 && (cat === 'smp' || cat === 'sma')) {
            const colors = ['text-amber-500', 'text-slate-400', 'text-amber-700'];
            grandFinalBadge = `<span class="inline-flex items-center gap-0.5 ml-1 text-[8px] px-1 py-0.2 rounded-full bg-amber-100 border border-amber-300 text-amber-900 font-black animate-glow">
              <i class="fa-solid fa-trophy ${colors[index]}"></i> GF
            </span>`;
          }

          return `
            <tr class="${rankBgClass} border-b border-slate-100 text-[10px] leading-none">
              <td class="py-[2px] px-2 font-bold text-slate-800">
                <div class="flex items-center">
                  <span class="inline-block px-1.5 py-0.5 rounded text-[9px] ${rankBadgeStyle}">
                    ${item.rank || (index + 1)}
                  </span>
                  ${grandFinalBadge}
                </div>
              </td>
              <td class="py-[2px] px-2 text-center font-extrabold text-blue-600 text-[11px] w-20">
                ${item.totalNilai}
              </td>
              <td class="py-[2px] px-2 text-center font-bold text-pink-600 text-[10px] w-16">
                ${item.pbb}
              </td>
            </tr>
          `;
        }).join('');

        table.innerHTML = `
          <thead>
            <tr class="bg-slate-100 text-slate-600 text-[9px] font-black uppercase tracking-wider border-b border-slate-200">
              <th class="py-1 px-2 text-left">RANK</th>
              <th class="py-1 px-2 text-center w-20">TOTAL</th>
              <th class="py-1 px-2 text-center w-16">PBB</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${rowsHtml}
          </tbody>
        `;

        container.appendChild(table);
      });
    }

    // Inisialisasi
    fetchData();
    setInterval(fetchData, 5000); // Auto-refresh 5 detik
  </script>
</body>
</html>
