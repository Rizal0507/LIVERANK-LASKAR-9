<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE RANK LKBB LASKAR 9</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
          colors: {
            brandBlue: '#1E40AF',
            brandPink: '#EC4899',
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      height: 100vh;
      overflow: hidden;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
    .gradient-header {
      background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 50%, #831843 100%);
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    .animate-glow {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans flex flex-col justify-between h-screen p-0 m-0">

  <!-- HEADER / BRANDING (DIPERBESAR SESUAI DESAIN ACUAN) -->
  <header class="gradient-header text-white shadow-2xl border-b-4 border-pink-500 py-3 px-4 flex-shrink-0">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <!-- LOGO KIRI -->
      <div class="flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1Hrwrv_NmmmPfOz8jF-S1PqVpnfh5iVF2" 
             alt="Logo Kiri" 
             class="h-16 md:h-20 w-auto object-contain drop-shadow-xl rounded-xl bg-white/10 p-1 border border-white/20">
      </div>

      <!-- JUDUL & PROMOSI -->
      <div class="text-center flex-1">
        <h1 class="text-2xl md:text-4xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-blue-200 via-pink-200 to-white leading-tight uppercase drop-shadow-md">
          LIVE RANK LKBB LASKAR 9
        </h1>
        
        <!-- PROMO SUBTITLE -->
        <div class="mt-2 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-xs md:text-sm font-semibold text-pink-200">
          <span class="bg-blue-900/70 px-3 py-1 rounded-full border border-blue-400/40 shadow-sm">
            Rekap by <strong class="text-white font-extrabold">Rekap Andalan</strong>
          </span>
          <span class="flex items-center gap-1.5 bg-pink-900/70 px-3 py-1 rounded-full border border-pink-400/40 shadow-sm">
            <i class="fab fa-instagram text-pink-400"></i> Tjobrut.store | cosmoatribut
          </span>
          <span class="flex items-center gap-1.5 bg-green-900/70 px-3 py-1 rounded-full border border-green-400/40 text-green-300 shadow-sm">
            <i class="fab fa-whatsapp text-green-400"></i> 0896-9402-4600
          </span>
        </div>
      </div>

      <!-- LOGO KANAN -->
      <div class="flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0" 
             alt="Logo Kanan" 
             class="h-16 md:h-20 w-auto object-contain drop-shadow-xl rounded-xl bg-white/10 p-1 border border-white/20">
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="flex-1 flex flex-col justify-between px-3 py-2 overflow-hidden max-w-[1600px] w-full mx-auto">
    
    <!-- TAB NAVIGASI TINGKATAN & REFRESH STATUS -->
    <div class="flex items-center justify-between mb-1.5 flex-shrink-0">
      <div class="inline-flex p-1 space-x-1 bg-white rounded-xl shadow-sm border border-slate-200">
        <button onclick="switchTab('purna')" id="tab-purna" 
                class="px-3 py-1 rounded-lg font-bold text-xs transition-all duration-200">
          PURNA / MANAGEMENT <span class="ml-1 text-[10px] px-1.5 py-0.2 rounded-full bg-slate-200 text-slate-700">10</span>
        </button>
        <button onclick="switchTab('smp')" id="tab-smp" 
                class="px-3 py-1 rounded-lg font-bold text-xs transition-all duration-200">
          SMP / MTs <span class="ml-1 text-[10px] px-1.5 py-0.2 rounded-full bg-slate-200 text-slate-700">29</span>
        </button>
        <button onclick="switchTab('sma')" id="tab-sma" 
                class="px-3 py-1 rounded-lg font-bold text-xs transition-all duration-200">
          SMA / SMK / MA <span class="ml-1 text-[10px] px-1.5 py-0.2 rounded-full bg-slate-200 text-slate-700">26</span>
        </button>
      </div>

      <!-- STATUS LIVE -->
      <div class="flex items-center gap-2 text-xs font-semibold text-slate-600">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-pink-500"></span>
        </span>
        <span id="last-update" class="text-[11px] text-slate-500 italic">Memuat data...</span>
      </div>
    </div>

    <!-- KONTAINER TABEL DUA KOLOM -->
    <div id="table-container" class="flex-1 flex items-center justify-center overflow-hidden">
      <!-- Tabel di-render secara dinamis oleh JavaScript -->
    </div>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const GAS_API_URL = "URL_WEB_APP_GOOGLE_SCRIPT_ANDA";

    let currentTab = 'smp'; 
    let liveData = { purna: [], smp: [], sma: [] };
    let previousTop3State = { purna: "", smp: "", sma: "" };

    const tabClasses = {
      active: "bg-gradient-to-r from-blue-600 to-pink-500 text-white shadow-sm",
      inactive: "text-slate-600 hover:text-slate-900 hover:bg-slate-100"
    };

    function switchTab(tab) {
      currentTab = tab;
      ['purna', 'smp', 'sma'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        btn.className = `px-3 py-1 rounded-lg font-bold text-xs transition-all duration-200 ${t === tab ? tabClasses.active : tabClasses.inactive}`;
      });
      renderTable();
    }

    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        liveData = data;
        
        checkConfettiTrigger();
        renderTable();

        const now = new Date();
        document.getElementById('last-update').innerText = `Live Update: ${now.toLocaleTimeString('id-ID')}`;
      } catch (error) {
        console.error("Gagal mengambil data:", error);
      }
    }

    // Deteksi Perubahan Top 3 untuk Kembang Api
    function checkConfettiTrigger() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const top3 = (liveData[cat] || []).slice(0, 3);
        const currentSignature = top3.map(item => `${item.namaSekolah}:${item.totalNilai}`).join('|');

        if (previousTop3State[cat] && previousTop3State[cat] !== currentSignature) {
          const hasScores = top3.some(item => item.totalNilai > 0);
          if (hasScores && cat === currentTab) {
            triggerConfetti();
          }
        }
        previousTop3State[cat] = currentSignature;
      });
    }

    // Efek Confetti Kembang Api
    function triggerConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // Render Tabel Bersisian (Multi-Kolom) tanpa Scrollbar
    function renderTable() {
      const container = document.getElementById('table-container');
      container.innerHTML = '';

      const items = liveData[currentTab] || [];

      if (items.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-slate-400 font-semibold bg-white rounded-xl shadow border">Belum ada data tersedia</div>`;
        return;
      }

      const useTwoColumns = items.length > 12;

      let columnsData = [];
      if (useTwoColumns) {
        const mid = Math.ceil(items.length / 2);
        columnsData.push(items.slice(0, mid));
        columnsData.push(items.slice(mid));
      } else {
        columnsData.push(items);
      }

      const gridWrapper = document.createElement('div');
      gridWrapper.className = `grid grid-cols-1 ${useTwoColumns ? 'lg:grid-cols-2' : 'max-w-2xl mx-auto'} gap-3 w-full h-full items-start`;

      columnsData.forEach((colItems, colIndex) => {
        const tableCard = document.createElement('div');
        tableCard.className = "glass-card rounded-xl shadow border border-slate-200 overflow-hidden w-full";

        let rowsHtml = colItems.map((item, idx) => {
          const actualIndex = useTwoColumns ? (colIndex * Math.ceil(items.length / 2) + idx) : idx;
          const isTop3 = actualIndex < 3;

          let rankBgClass = "bg-white hover:bg-slate-50";
          if (actualIndex === 0) rankBgClass = "bg-amber-50/90 font-bold";
          else if (actualIndex === 1) rankBgClass = "bg-slate-100/90 font-bold";
          else if (actualIndex === 2) rankBgClass = "bg-orange-50/90 font-bold";

          let grandFinalBadge = "";
          if (isTop3 && (currentTab === 'smp' || currentTab === 'sma')) {
            const colors = ['text-amber-500', 'text-slate-400', 'text-amber-700'];
            grandFinalBadge = `<span class="inline-flex items-center gap-1 ml-1 text-[9px] px-1 py-0.2 rounded-full bg-gradient-to-r from-amber-100 to-yellow-200 border border-amber-300 text-amber-900 font-extrabold animate-glow">
              <i class="fa-solid fa-trophy ${colors[actualIndex]}"></i> GF
            </span>`;
          }

          let rankBadgeStyle = "bg-slate-200 text-slate-700";
          if (actualIndex === 0) rankBadgeStyle = "bg-amber-500 text-white shadow-xs";
          else if (actualIndex === 1) rankBadgeStyle = "bg-slate-400 text-white shadow-xs";
          else if (actualIndex === 2) rankBadgeStyle = "bg-amber-700 text-white shadow-xs";

          return `
            <tr class="${rankBgClass} border-b border-slate-100 text-[11px] leading-snug">
              <td class="py-1 px-2 text-center w-28">
                <span class="inline-block px-2 py-0.5 rounded text-[10px] font-extrabold ${rankBadgeStyle}">
                  ${item.rank || (actualIndex + 1)}
                </span>
              </td>
              <td class="py-1 px-2 font-semibold text-slate-800 truncate">
                <div class="flex items-center justify-between">
                  <span class="truncate">${item.namaSekolah || '-'}</span>
                  ${grandFinalBadge}
                </div>
              </td>
              <td class="py-1 px-2 text-center font-extrabold text-blue-700 text-xs w-20">
                ${item.totalNilai}
              </td>
              <td class="py-1 px-2 text-center font-bold text-pink-600 text-[11px] w-16">
                ${item.pbb}
              </td>
            </tr>
          `;
        }).join('');

        tableCard.innerHTML = `
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white text-[10px] uppercase tracking-wider">
                <th class="py-1 px-2 text-center w-28">RANK</th>
                <th class="py-1 px-2">NAMA SEKOLAH</th>
                <th class="py-1 px-2 text-center w-20">TOTAL</th>
                <th class="py-1 px-2 text-center w-16">PBB</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        `;
        gridWrapper.appendChild(tableCard);
      });

      container.appendChild(gridWrapper);
    }

    // Inisialisasi
    switchTab('smp');
    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
