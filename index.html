<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE RANK LKBB LASKAR 9</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: #0b1120;
    }
    
    * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .header-gradient {
      background: linear-gradient(135deg, #0284c7 0%, #1e40af 40%, #be185d 100%);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    .animate-glow {
      animation: pulseGlow 1.8s infinite;
    }

    .glow-green {
      filter: drop-shadow(0 0 6px #22c55e);
    }
    .glow-red {
      filter: drop-shadow(0 0 6px #ef4444);
    }
  </style>
</head>
<body class="text-slate-800 font-sans flex flex-col justify-between h-screen p-0 m-0">

  <!-- HEADER BRANDING (DIPERBESAR & LEBIH JELAS) -->
  <header class="header-gradient text-white shadow-2xl border-b-2 border-pink-400 py-2.5 px-6 flex-shrink-0">
    <div class="max-w-[1920px] mx-auto flex items-center justify-between gap-4">
      
      <!-- SISI KIRI: LOGO KIRI & LIVE CLOCK REAL-TIME -->
      <div class="flex items-center gap-4 flex-shrink-0">
        <img src="https://lh3.googleusercontent.com/d/1Hrwrv_NmmmPfOz8jF-S1PqVpnfh5iVF2" 
             alt="Logo Kiri" 
             class="h-16 md:h-20 w-auto object-contain drop-shadow-[0_0_12px_rgba(255,255,255,0.5)]">
        
        <!-- POSISI LIVE BERLALUAN DENGAN LAST UPDATE -->
        <div class="flex items-center gap-2 bg-pink-950/80 px-3 py-1.5 rounded-xl border border-pink-400/50 shadow-md">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-pink-500"></span>
          </span>
          <div class="flex flex-col">
            <span class="text-[9px] text-pink-300 font-black tracking-widest uppercase leading-none">STATUS LIVE</span>
            <span id="live-realtime-clock" class="text-xs md:text-sm font-black text-white leading-tight">00:00:00 WIB</span>
          </div>
        </div>
      </div>

      <!-- SISI TENGAH: JUDUL & REKAP BY REKAP ANDALAN -->
      <div class="text-center flex-1">
        <h1 class="text-2xl md:text-4xl font-black tracking-wider text-white uppercase drop-shadow-[0_2px_10px_rgba(0,0,0,0.5)]">
          RANK LKBB LASKAR 9
        </h1>
        
        <div class="mt-1 flex items-center justify-center gap-2 text-xs md:text-sm font-bold text-blue-100">
          <span class="h-[1px] w-8 md:w-16 bg-blue-300/40"></span>
          <span>REKAP BY <strong class="text-white font-extrabold uppercase tracking-wider">REKAP ANDALAN</strong></span>
          <span class="hidden md:inline text-blue-300/50">|</span>
          <span class="hidden md:flex items-center gap-1 text-pink-200">
            <i class="fab fa-instagram text-pink-300"></i> Tjobrut.store | cosmoatribut
          </span>
          <span class="hidden md:inline text-blue-300/50">|</span>
          <span class="hidden md:flex items-center gap-1 text-emerald-300">
            <i class="fab fa-whatsapp text-emerald-300"></i> 0896-9402-4600
          </span>
          <span class="h-[1px] w-8 md:w-16 bg-blue-300/40"></span>
        </div>
      </div>

      <!-- SISI KANAN: LAST UPDATE & LOGO KANAN -->
      <div class="flex items-center gap-4 flex-shrink-0">
        <!-- LAST UPDATE HANYA BERUBAH JIKA POSISI/NILAI BERUBAH -->
        <div class="flex flex-col items-end bg-blue-950/70 px-3.5 py-1.5 rounded-xl border border-blue-400/40 shadow-md text-right">
          <span class="text-[9px] text-blue-200 uppercase tracking-widest font-black flex items-center gap-1 leading-none">
            <i class="fa-regular fa-clock"></i> LAST UPDATE
          </span>
          <span id="last-update-clock" class="text-xs md:text-sm font-black text-amber-300 leading-tight">--:--:-- WIB</span>
        </div>

        <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0" 
             alt="Logo Kanan" 
             class="h-16 md:h-20 w-auto object-contain drop-shadow-[0_0_12px_rgba(255,255,255,0.5)]">
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA: 3 KOTAK TINGKATAN BERSISIAN (PROPORSI PENUH MEMENUHI LAYAR) -->
  <main class="flex-1 px-3 py-2 overflow-hidden max-w-[1920px] w-full mx-auto flex flex-col justify-between">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 h-full items-stretch">
      
      <!-- KATEGORI 1: PURNA / MANAGEMENT -->
      <div class="bg-white border-2 border-pink-400 rounded-2xl shadow-xl flex flex-col overflow-hidden h-full">
        <div class="bg-gradient-to-r from-pink-600 to-rose-500 text-white font-black text-center py-1.5 px-3 text-sm md:text-base tracking-wider uppercase shadow flex items-center justify-center">
          PURNA / MANAGEMENT
        </div>
        <div class="flex-1 p-2 flex flex-col justify-between overflow-hidden" id="card-purna">
          <!-- Render via JS -->
        </div>
      </div>

      <!-- KATEGORI 2: SMP / MTs -->
      <div class="bg-white border-2 border-blue-400 rounded-2xl shadow-xl flex flex-col overflow-hidden h-full">
        <div class="bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-black text-center py-1.5 px-3 text-sm md:text-base tracking-wider uppercase shadow flex items-center justify-center">
          SMP / MTs
        </div>
        <div class="flex-1 p-2 flex flex-col justify-between overflow-hidden" id="card-smp">
          <!-- Render via JS -->
        </div>
      </div>

      <!-- KATEGORI 3: SMA / SMK / MA -->
      <div class="bg-white border-2 border-pink-400 rounded-2xl shadow-xl flex flex-col overflow-hidden h-full">
        <div class="bg-gradient-to-r from-pink-600 to-purple-600 text-white font-black text-center py-1.5 px-3 text-sm md:text-base tracking-wider uppercase shadow flex items-center justify-center">
          SMA / SMK / MA
        </div>
        <div class="flex-1 p-2 flex flex-col justify-between overflow-hidden" id="card-sma">
          <!-- Render via JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwGdIdN41HgOWlP6YnWfaS2HcONT7JHYaLQ-8a9uouYSjTiYnvzCXa8NCRdn59EkE1h/exec";

    let liveData = { purna: [], smp: [], sma: [] };
    let previousRanks = { purna: {}, smp: {}, sma: {} };
    let previousFullSignature = { purna: "", smp: "", sma: "" };

    const tabLimits = { purna: 10, smp: 29, sma: 26 };

    // 1. JAM LIVE REAL-TIME (BERJALAN TIAP DETIK)
    function updateLiveRealtimeClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
      document.getElementById('live-realtime-clock').innerText = `${timeString} WIB`;
    }
    setInterval(updateLiveRealtimeClock, 1000);
    updateLiveRealtimeClock();

    async function fetchData() {
      try {
        const response = await fetch(GAS_API_URL);
        const data = await response.json();
        
        let hasChanged = false;

        // Cek perubahan data/posisi rank
        ['purna', 'smp', 'sma'].forEach(cat => {
          const maxLimit = tabLimits[cat];
          const rawItems = (data[cat] || []).slice(0, maxLimit);
          const currentSignature = rawItems.map(item => `${item.rank}:${item.totalNilai}:${item.pbb}`).join('|');

          if (previousFullSignature[cat] !== currentSignature) {
            hasChanged = true;
          }
        });

        // Update LAST UPDATE HANYA jika ada pergeseran/perubahan nilai
        if (hasChanged || document.getElementById('last-update-clock').innerText.includes('--')) {
          const now = new Date();
          document.getElementById('last-update-clock').innerText = `${now.toLocaleTimeString('id-ID', { hour12: false })} WIB`;
        }

        checkConfettiTrigger(data);
        liveData = data;
        renderAllCategories();

      } catch (error) {
        console.error("Gagal mengambil data:", error);
      }
    }

    // Deteksi Perubahan Top 3 untuk Kembang Api
    function checkConfettiTrigger(newData) {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const maxLimit = tabLimits[cat];
        const rawItems = (newData[cat] || []).slice(0, maxLimit);
        const top3 = rawItems.slice(0, 3);
        const currentSignature = top3.map(item => `${item.rank}:${item.totalNilai}`).join('|');

        if (previousFullSignature[cat] && previousFullSignature[cat] !== currentSignature) {
          const hasScores = top3.some(item => item.totalNilai > 0);
          if (hasScores) {
            triggerConfetti();
          }
        }
        previousFullSignature[cat] = currentSignature;
      });
    }

    // Efek Confetti Kembang Api
    function triggerConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // Render Semua Kategori Sesuai Proporsi Penuh Layar
    function renderAllCategories() {
      ['purna', 'smp', 'sma'].forEach(cat => {
        const container = document.getElementById(`card-${cat}`);
        container.innerHTML = '';

        const maxLimit = tabLimits[cat];
        const items = (liveData[cat] || []).slice(0, maxLimit);

        if (items.length === 0) {
          container.innerHTML = `<div class="p-4 text-center text-slate-400 font-semibold italic text-xs">Memuat data...</div>`;
          return;
        }

        // Ambil Top 3 untuk Podium Cards
        const top3 = items.slice(0, 3);
        const remainingItems = items.slice(3);

        // --- 1. CARD JUARA UTAMA 1, 2, 3 (LEBIH RINGKAS & TIDAK TERLALU LEBAR) ---
        const podiumWrapper = document.createElement('div');
        podiumWrapper.className = "grid grid-cols-3 gap-1.5 mb-2 flex-shrink-0";

        const podiumConfig = [
          { bg: 'bg-amber-50 border-amber-300', medalBg: 'bg-amber-500 text-white', num: '1', titleColor: 'text-amber-900' },
          { bg: 'bg-slate-50 border-slate-300', medalBg: 'bg-slate-400 text-white', num: '2', titleColor: 'text-slate-800' },
          { bg: 'bg-orange-50 border-orange-300', medalBg: 'bg-amber-700 text-white', num: '3', titleColor: 'text-orange-950' }
        ];

        let podiumHtml = '';
        for (let i = 0; i < 3; i++) {
          const item = top3[i] || { rank: `UTAMA ${i+1}`, totalNilai: 0, pbb: 0 };
          const cfg = podiumConfig[i];

          // Badge GF khusus Juara Utama di SMP & SMA
          let gfBadge = '';
          if (cat === 'smp' || cat === 'sma') {
            gfBadge = `<span class="inline-flex items-center gap-0.5 text-[8px] px-1 py-0.2 rounded bg-amber-200 border border-amber-400 text-amber-950 font-black animate-glow">
              <i class="fa-solid fa-trophy text-amber-600"></i> GF
            </span>`;
          }

          podiumHtml += `
            <div class="${cfg.bg} border rounded-xl p-1.5 flex items-center justify-between shadow-xs min-h-[42px]">
              <div class="flex items-center gap-1.5 min-w-0">
                <div class="w-5 h-5 rounded-full ${cfg.medalBg} font-black text-[10px] flex items-center justify-center shadow-xs flex-shrink-0">
                  ${cfg.num}
                </div>
                <div class="truncate leading-tight">
                  <div class="text-[9px] font-black ${cfg.titleColor} truncate">
                    ${item.rank || `UTAMA ${i+1}`}
                  </div>
                  ${gfBadge}
                </div>
              </div>
              <div class="text-right flex-shrink-0 pl-1">
                <div class="text-[11px] font-black text-blue-700 leading-none">${item.totalNilai}</div>
                <div class="text-[8px] font-bold text-pink-600 leading-none mt-0.5">PBB: ${item.pbb}</div>
              </div>
            </div>
          `;
        }
        podiumWrapper.innerHTML = podiumHtml;
        container.appendChild(podiumWrapper);

        // --- 2. TABEL PROPORSI PENUH LAYAR (JARAK DEKAT & SEGITIGA PERPINDAHAN RANK) ---
        const mid = Math.ceil(remainingItems.length / 2);
        const leftList = remainingItems.slice(0, mid);
        const rightList = remainingItems.slice(mid);

        const tablesGrid = document.createElement('div');
        tablesGrid.className = "grid grid-cols-2 gap-2 flex-1 items-stretch overflow-hidden";

        const isPinkHeader = cat === 'purna' || cat === 'sma';
        const headerBg = isPinkHeader ? 'bg-pink-600' : 'bg-blue-600';

        function buildSubTable(dataList, startIndex) {
          if (dataList.length === 0) return `<div class="h-full bg-slate-50 rounded-xl border border-slate-100"></div>`;

          const rows = dataList.map((item, idx) => {
            const actualIndex = startIndex + idx;
            const itemKey = item.rank || `row-${actualIndex}`;

            // Hitung Perubahan Posisi Rank (Segitiga Merah/Hijau Berpendar)
            let arrowIndicator = "";
            if (previousRanks[cat] && previousRanks[cat][itemKey] !== undefined) {
              const prevIdx = previousRanks[cat][itemKey];
              if (actualIndex < prevIdx) {
                // Posisi Naik (Segitiga Hijau)
                arrowIndicator = `<span class="text-emerald-500 font-black text-[10px] ml-1 animate-glow glow-green">▲</span>`;
              } else if (actualIndex > prevIdx) {
                // Posisi Turun (Segitiga Merah)
                arrowIndicator = `<span class="text-rose-500 font-black text-[10px] ml-1 animate-glow glow-red">▼</span>`;
              }
            }

            // Simpan posisi terbaru
            if (!previousRanks[cat]) previousRanks[cat] = {};
            previousRanks[cat][itemKey] = actualIndex;

            return `
              <tr class="bg-white hover:bg-slate-50 border-b border-slate-100 text-[10px] md:text-[11px] leading-tight">
                <td class="py-1 px-1.5 text-center font-bold text-slate-400 w-6">${item.no || (actualIndex + 4)}</td>
                <td class="py-1 px-1.5 font-extrabold text-slate-800 truncate">
                  <div class="flex items-center">
                    <span class="truncate">${item.rank || '-'}</span>
                    ${arrowIndicator}
                  </div>
                </td>
                <td class="py-1 px-1.5 text-center font-black text-blue-700 w-10">${item.totalNilai}</td>
                <td class="py-1 px-1.5 text-center font-bold text-pink-600 w-9">${item.pbb}</td>
              </tr>
            `;
          }).join('');

          return `
            <div class="border border-slate-200 rounded-xl overflow-hidden shadow-xs h-full flex flex-col justify-between bg-white">
              <table class="w-full text-left border-collapse h-full">
                <thead>
                  <tr class="${headerBg} text-white text-[9px] md:text-[10px] font-black uppercase tracking-wider">
                    <th class="py-1 px-1.5 text-center w-6">#</th>
                    <th class="py-1 px-1.5">RANK</th>
                    <th class="py-1 px-1.5 text-center w-10">TOT</th>
                    <th class="py-1 px-1.5 text-center w-9">PBB</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 flex-1">
                  ${rows}
                </tbody>
              </table>
            </div>
          `;
        }

        tablesGrid.innerHTML = buildSubTable(leftList, 0) + buildSubTable(rightList, leftList.length);
        container.appendChild(tablesGrid);
      });
    }

    // Inisialisasi
    fetchData();
    setInterval(fetchData, 5000); // Auto-refresh data 5 detik
  </script>
</body>
</html>
